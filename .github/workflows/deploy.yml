
name: DSO303 Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------
  # 1. Build and validate Docker images
  # -------------------------------------------------------
  docker-build:
    name: Build Backend and Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: dso303-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: dso303-frontend:ci

  # -------------------------------------------------------
  # 2. Publish backend image to Amazon ECR
  # -------------------------------------------------------
  publish-backend:
    name: Publish Backend to Amazon ECR
    runs-on: ubuntu-24.04
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dso303-assignment2-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/dso303-assignment2-backend:${{ github.sha }}

      # ---------------------------------------------------
      # 3. Refresh EC2 instances after backend deployment
      # ---------------------------------------------------
      - name: Start EC2 Instance Refresh
        env:
          ASG_NAME: ${{ vars.AWS_API_ASG_NAME }}
        run: |
          if [ -z "$ASG_NAME" ]; then
            echo "::error::AWS_API_ASG_NAME is not configured."
            exit 1
          fi

          echo "Starting instance refresh for $ASG_NAME"

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}'

          echo "Instance refresh requested successfully."

  # -------------------------------------------------------
  # 4. Deploy React frontend to Amazon S3 and CloudFront
  # -------------------------------------------------------
  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-24.04
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Validate AWS Deployment Variables
        env:
          FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
          CLOUDFRONT_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "::error::AWS_FRONTEND_BUCKET is missing."
            exit 1
          fi

          if [ -z "$CLOUDFRONT_ID" ]; then
            echo "::error::AWS_CLOUDFRONT_DISTRIBUTION_ID is missing."
            exit 1
          fi

      - name: Upload Frontend to S3
        env:
          FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" \
            --delete

          echo "Frontend files uploaded successfully."

      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"

          echo "CloudFront invalidation requested successfully."
